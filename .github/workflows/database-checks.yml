name: MySQL migration checks
on:
  workflow_call:
  push:
    branches: [dev, 'codex/auth-*']
    paths: ['services/backend/**', 'services/identity/**', 'infra/db/**', 'infra/windows/**', 'infra/pm2/**', '.github/workflows/deploy-development.yml', '.github/workflows/database-checks.yml']
  pull_request:
    paths: ['services/backend/**', 'services/identity/**', 'infra/db/**', 'infra/windows/**', 'infra/pm2/**', '.github/workflows/deploy-development.yml', '.github/workflows/database-checks.yml']
permissions:
  contents: read
jobs:
  fresh-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
          MYSQL_DATABASE: app_migration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PowerShell deployment syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/infra/windows/deploy-development.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - run: node --check infra/pm2/ecosystem.config.js
      - run: pip install -r infra/db/requirements.txt
      - run: pip install -r services/identity/requirements.txt
      - run: python -m unittest services.identity.test_identity services.identity.test_http services.identity.test_provider services.identity.test_account_contract services.identity.test_email_templates -v
      - run: python -m unittest services.identity.test_provision services.identity.test_deployment_check -v
      - run: python -m unittest services.backend.test_mysql_app -v
      - run: python infra/db/test_db.py
      - run: python infra/db/test_mysql.py
        env:
          MYSQL_TEST_DATABASE: app_migration_test
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: isolated-ci-password
      - run: python -m services.identity.test_mysql
        env:
          IDENTITY_TEST_PRODUCT: split
          MYSQL_TEST_DATABASE: app_migration_test
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: isolated-ci-password
