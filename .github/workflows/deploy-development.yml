name: Deploy development backend
on:
  push:
    branches: [dev]
    paths:
      - services/backend/**
      - services/identity/**
      - infra/db/**
      - infra/windows/**
      - infra/pm2/**
      - requirements*.txt
      - .github/workflows/database-checks.yml
      - .github/workflows/deploy-development.yml
  workflow_dispatch:
    inputs:
      port:
        description: Confirmed free Windows loopback port for Split API
        required: false
        default: 3400
        type: number
      bind_recovered_members:
        description: Bind the four imported legacy members using the verified original ID map
        default: false
        type: boolean
      apply_migrations:
        description: Apply pending development migrations after backup
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: split-development-windows
  cancel-in-progress: false
jobs:
  database-checks:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/database-checks.yml
  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: database-checks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Controlled development deployment
        shell: pwsh
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_PORT: ${{ inputs.port || vars.SPLIT_DEV_PORT || 3400 }}
          BIND_RECOVERED: ${{ inputs.bind_recovered_members || false }}
          APPLY_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations || false }}
        run: |
          & .\infra\windows\deploy-development.ps1 -DeployRoot 'D:\network_share\apps\development\split' -Port ([int]$env:DEPLOY_PORT) -ExpectedCommit $env:DEPLOY_COMMIT -ApplyMigrations:($env:APPLY_MIGRATIONS -eq 'true') -BindRecoveredMembers:($env:BIND_RECOVERED -eq 'true')
