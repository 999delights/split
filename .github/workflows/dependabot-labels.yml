name: Dependabot labels

# Labels Dependabot PRs that need code changes before they can be merged: a major update, a 0.x minor update
# (breaking under semver), or a requirement range moved past its old upper bound. Grouped minor/patch PRs stay
# unlabelled and go the normal road. Dependabot PRs only, on our own runner: no checkout, no secrets (only the
# PR's own token).
on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - name: Label updates that need code changes
        uses: actions/github-script@v9
        env:
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
        with:
          script: |
            const label = 'major-needs-code';
            const plain = version => /^v?\d+(\.\d+)*([+-][0-9A-Za-z.+-]*)?$/.test(version);
            const numbers = text => (text.match(/\d+(\.\d+)*/g) || []).map(item => item.split('.').map(Number));
            // the level that can break: the major, or the minor under 0.x
            const level = ([major = 0, minor = 0]) => major === 0 ? [0, minor] : [major, 0];
            const compare = (a, b) => a[0] - b[0] || a[1] - b[1];
            const needsCode = dep => {
              const prev = String(dep.prevVersion || '').trim(), next = String(dep.newVersion || '').trim();
              if (!next) return false;
              if (prev && !plain(prev)) {
                // A requirement range (pip ">=3.0,<4" arrives as "4,>=3.0"): it needs code when the new version
                // passes the highest version the old range names; a two-sided range excludes its upper bound.
                const named = numbers(prev);
                if (!named.length) return false;
                const top = named.map(level).sort(compare).pop();
                const step = compare(level(numbers(next)[0] || []), top);
                return step > 0 || (step === 0 && named.length > 1);
              }
              if (dep.updateType === 'version-update:semver-major') return true;
              if (!prev) return false;
              const [before, after] = [numbers(prev)[0] || [], numbers(next)[0] || []];
              return before[0] === 0 && after[0] === 0 && before[1] !== after[1];
            };
            const found = JSON.parse(process.env.UPDATED || '[]').filter(needsCode);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const labelled = pr.labels.some(item => item.name === label);
            if (found.length) {
              core.notice(`Needs code changes: ${found.map(dep => `${dep.dependencyName} ${dep.prevVersion} -> ${dep.newVersion}`).join(', ')}`);
              if (!labelled) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });
            } else if (labelled) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label });
            }
