# Dependabot: automatic dependency updates for split.
#
# - Every Monday it checks the folders below and opens PRs into dev (the default branch; no target-branch
#   on purpose, so these settings also apply to security updates).
# - Python: every requirements folder is in ONE entry (directories), because the DEV deploy installs them together
#   into one environment: a package must have the same pin in every file. Groups span all the folders: one
#   "minor-patch" PR for the whole repo, "flask" / "flask-major" for Flask and its family, and each other major or
#   0.x package as one PR across every file (group-by: dependency-name). On 2026-11-24 a per-folder security bump
#   of python-dotenv left 1.0.0 in another file and stopped the DEV deploy.
#   Security updates are made per folder by Dependabot whatever the groups; the "MySQL migration checks" workflow
#   installs every requirements file together, so a PR that splits a pin fails there before the merge.
# - Majors and 0.x minors are labelled "major-needs-code" (.github/workflows/dependabot-labels.yml) and wait for a
#   session that adapts the code. Nothing is auto-merged.
# - pip: versioning-strategy increase-if-necessary (a range changes only when the newest version falls outside it).
# - cooldown: a new release must be 7 days old before it is proposed. Security updates skip it.
# - Not here yet: the Flutter app (apps/mobile, pub). It is built and checked on the Mac, which has no
#   validation road yet, so its updates would land untested.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/infra/db","/services/identity"]
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Bucharest
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "deps(python)"
    groups:
      flask:
        patterns: ["flask","flask-*","werkzeug","jinja2","itsdangerous","click","blinker","markupsafe"]
        update-types: [minor, patch]
      flask-major:
        patterns: ["flask","flask-*","werkzeug","jinja2","itsdangerous","click","blinker","markupsafe"]
        update-types: [major]
      zero-x:
        patterns: ["sqlparse"]
        group-by: dependency-name
      major:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name
      minor-patch:
        patterns: ["*"]
        exclude-patterns: ["sqlparse"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Bucharest
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "deps(actions)"
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
