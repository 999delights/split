# Dependabot: automatic dependency updates for split.
#
# - Every Monday it checks the folders below and opens PRs into dev (the default branch; no target-branch
#   on purpose, so these settings also apply to security updates).
# - Compatibility: packages that must move together are one family and never update apart. Each family has a
#   minor/patch group and a "-major" group: nuxt-vue (nuxt, @nuxt/*, @nuxtjs/*, vue, vue-router, pinia),
#   test-tools (vitest, @vitest/*, happy-dom, jsdom, @nuxt/test-utils, @vue/test-utils), vite (vite, @vitejs/*,
#   vite-plugin-*), vee-validate, stripe-js, flask (Flask, Flask-*, Werkzeug, Jinja2, ...), numpy (numpy, scipy,
#   trimesh, manifold3d, ...). three + @types/three are 0.x, so they are one group of any update type.
#   Everything else: one "minor-patch" group per folder. A package belongs to its most specific group only.
# - Majors: a family's majors come together in its "-major" PR; any other major comes as its own PR. The label
#   workflow (.github/workflows/dependabot-labels.yml) marks them "major-needs-code" and they wait for a session
#   that adapts the code. Nothing is ever auto-merged.
# - 0.x packages without a family (exclude-patterns) come as their own PRs: under semver a 0.x minor can break,
#   so the label workflow marks those minors too.
# - cooldown: a new release must be 7 days old before it is proposed (broken or malicious releases are usually
#   pulled by then). Security updates skip the cooldown.
# - At most 5 open PRs per folder (the default): the groups are made first, then single majors fill the rest.
# - Not here yet: the Flutter app (apps/mobile, pub). It is built and checked on the Mac, which has no
#   validation road yet, so its updates would land untested.
version: 2
updates:
  - package-ecosystem: pip
    directory: /infra/db
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Bucharest
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "deps(infra-db)"
    groups:
      minor-patch:
        patterns: ["*"]
        exclude-patterns: ["sqlparse"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/identity
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Bucharest
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "deps(services-identity)"
    groups:
      flask:
        patterns: ["flask","flask-*","werkzeug","jinja2","itsdangerous","click","blinker","markupsafe"]
        update-types: [minor, patch]
      flask-major:
        patterns: ["flask","flask-*","werkzeug","jinja2","itsdangerous","click","blinker","markupsafe"]
        update-types: [major]
      minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Bucharest
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "deps(actions)"
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
